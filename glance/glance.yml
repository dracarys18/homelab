theme:
  background-color: 0 0 0
  primary-color: 24 97 58
  negative-color: 209 88 54
pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: docker-containers
            hide-by-default: true
          - type: server-stats
            servers:
              - type: local
                name: Services
          - type: clock
            hour-format: 12h
          - type: calendar
          - type: twitch-channels
            channels:
              - theprimeagen
              - theanthonygg
              - tsoding
              - fabrizioromano

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            bangs:
              - title: Jenkins
                shortcut: "!jenkins"
                url: https://jenkins-hyperswitch.sso.internal.svc.k8s.office.mum.juspay.net

              - title: Grafana sandbox
                shortcut: "!gfsand"
                url: https://grafana.internal.staging.hyperswitch.eu.juspay.net

              - title: Grafana Prod
                shortcut: "!gfprod"
                url: https://grafana.utils.internal.prod.hyperswitch.juspay.net

              - title: Kibana Prod
                shortcut: "!kbprod"
                url: https://kibana.sso.utils.internal.prod.hyperswitch.juspay.net


          - type: videos
            style: grid-cards
            channels:
              - UCYO_jab_esuFRV4b17AJtAw #3blueonebrown
              - UCUyeluBRhGPCW4rPe_UvBZQ #PrimeGen
              - UCCwUTfKeDj4p9uTNrn9U6Sw #BBCArchive
              - UC9-y-6csu5WGm29I7JiwpnA #Computerphile
              - UCnbfV0YvrxWMq3h0hmo13Jg # Desi studios
              - UC_ML5xP23TOWKUcc-oAE_Eg # Nassir Hussain
              - UC_iD0xppBwwsrM9DegC5cQQ #Jon Jhengset
              - UClcE-kVhqyiHCcjYwcpfj9w #LiveOverflow
              - UCWiY6fYdxuEe78r-0uFCnhA #LongBeachGriffy
              - UCJ24N4O0bP7LGLBDvye7oCA #Matt Dvella
              - UCQYMhOMi_Cdj1CEAU-fv80A #Neso academy
              - UCnC8SAZzQiBGYVSKZ_S3y4Q #Nikhil Kamath
              - UCnHEz9DZ6EAof1-DaQGD_Xw #PPPeter
              - UCR1IuLEqb6UEA_zQ81kwXfg #Real Engineering
