services:
  glance:
    image: glanceapp/glance:v0.7.1
    labels:
      glance.name: Glance
      glance.icon: di:glance
      glance.url: https://glance.karthihegde.dev
      glance.description: Custom feed management
      glance.id: Glance
      glance.hide: false
    volumes:
      - ./assets/immich.png:/assets/immich.png
      - ./glance.yml:/app/config/glance.yml
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080
    restart: unless-stopped
