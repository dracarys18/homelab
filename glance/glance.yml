      - size: small
        widgets:
          - type: releases
            repositories:
              - immich-app/immich
              - glanceapp/glance
          - type: weather
            location: Bengaluru, India


  - name: Articles
    columns:
      - size: small
        widgets:
          - type: rss
            limit: 20
            collapse-after: 3
            style: vertical-list
            cache: 3h
            feeds:
              - url: https://db.cs.cmu.edu/files/rss/pvldb-rss.xml
              - url: https://blog.burntsushi.net/index.xml
              - url: http://techblog.netflix.com/feeds/posts/default
              - url: https://code.facebook.com/posts/rss
              - url: https://blog.flipkart.tech/feed
              - url: https://stripe.com/blog/feed.rss
              - url: https://discord.com/blog/rss.xml
              - url: https://blog.cloudflare.com/rss
              - url: https://www.cockroachlabs.com/feed/
              - url: https://hasura.io/blog/rss

      - size: full
        widgets:
          - type: hacker-news
            collapse-after: 15
            limit: 30

      - size: small
        widgets:
          - type: lobsters
            sort-by: hot
            tags:
              - go
              - rust
              - c
              - linux
              - android
              - security
              - devops
              - scaling
              - performance
              - compilers
              - vim
              - databases
              - zig
            limit: 20
            collapse-after: 15
